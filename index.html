<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Muslimah Studio | Recursos islámicos en español
    </title>

    <meta
        name="description"
        content="Recursos islámicos en español, ebooks, cursos y herramientas para fortalecer la fe y construir una vida con barakah."
    >

    <link rel="stylesheet" href="styles.css?v=1">
</head>

<body>

    <header class="site-header">

        <a
            href="#inicio"
            class="brand"
            aria-label="Ir al inicio de Muslimah Studio"
        >
            <img
                src="images/logo-blanco.png"
                alt="Muslimah Studio"
                class="brand-logo"
            >
        </a>

        <button
            class="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="main-nav"
        >
            Menú
        </button>

        <nav
            id="main-nav"
            class="main-nav"
            aria-label="Navegación principal"
        >
            <a href="#sobre">Sobre Muslimah Studio</a>
            <a href="#recursos">Recursos</a>
            <a href="#ebooks">Ebooks</a>
            <a href="#cursos">Cursos</a>
            <a href="#blog">Blog</a>

            <a href="#suscripcion" class="nav-cta">
                Recibir gratis el Kit
            </a>
        </nav>

    </header>

    <main>

        <section id="inicio" class="hero">

            <div class="hero-content">

                <p class="eyebrow">
                    Aprendizaje con fe
                </p>

                <h1>
                    Muslimah Studio
                </h1>

                <p class="hero-text">
                    Recursos islámicos en español, ebooks, cursos y
                    herramientas para fortalecer la fe y construir
                    una vida con barakah.
                </p>

                <div class="hero-actions">

                    <a
                        href="#suscripcion"
                        class="button button-primary"
                    >
                        Recibir gratis el Kit
                    </a>

                    <a
                        href="#recursos"
                        class="button button-secondary"
                    >
                        Explorar recursos
                    </a>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
